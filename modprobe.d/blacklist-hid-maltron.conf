# The Kinesis Freestyle2 for Mac (KB800HM) shares Alcor's 058F:9410 VID/PID
# with the Maltron L90, so hid-maltron claims it. That driver's report_fixup
# is gated on an exact match against the 106-byte Maltron descriptor:
#
#   if (*rsize == sizeof(maltron_rdesc_o) &&
#       !memcmp(maltron_rdesc_o, rdesc, sizeof(maltron_rdesc_o)))
#
# The Kinesis presents a different 53-byte descriptor, so the size check fails
# and the fixup returns the descriptor unmodified. hid-maltron therefore binds
# the device and does nothing useful, while preventing hid-generic from
# handling it.
#
# Blacklisting it lets hid-generic bind, which combined with the HID-BPF
# descriptor fixup in this package makes the media keys work.
#
# Remove this file if you actually own a Maltron L90.
blacklist hid-maltron
